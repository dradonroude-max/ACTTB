<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="title"
>
  <title id="title">VisionOS</title>

  <defs>
    <linearGradient
      id="vision-gradient"
      x1="8"
      y1="8"
      x2="56"
      y2="56"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5E5CE6" />
    </linearGradient>

    <linearGradient
      id="vision-highlight"
      x1="14"
      y1="10"
      x2="50"
      y2="54"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#000000"
        flood-opacity="0.18"
      />
    </filter>
  </defs>

  <!-- =====================================================
       VISIONOS SYMBOL
       ===================================================== -->

  <g filter="url(#shadow)">

    <!-- Main glass surface -->
    <rect
      x="4"
      y="4"
      width="56"
      height="56"
      rx="17"
      fill="url(#vision-gradient)"
    />

    <!-- Glass highlight -->
    <rect
      x="5"
      y="5"
      width="54"
      height="54"
      rx="16"
      fill="url(#vision-highlight)"
    />

    <!-- Back depth layer -->
    <path
      d="M20 17
         H42
         C44.2 17 46 18.8 46 21
         V43
         C46 45.2 44.2 47 42 47
         H20
         C17.8 47 16 45.2 16 43
         V21
         C16 18.8 17.8 17 20 17Z"
      fill="#FFFFFF"
      fill-opacity="0.14"
    />

    <!-- Middle depth layer -->
    <path
      d="M17 22
         H39
         C41.2 22 43 23.8 43 26
         V48
         C43 50.2 41.2 52 39 52
         H17
         C14.8 52 13 50.2 13 48
         V26
         C13 23.8 14.8 22 17 22Z"
      fill="#FFFFFF"
      fill-opacity="0.20"
    />

    <!-- Main Vision diamond -->
    <path
      d="M20 28
         L32 16
         L44 28
         L32 40
         Z"
      fill="#FFFFFF"
      fill-opacity="0.96"
    />

    <!-- Left depth face -->
    <path
      d="M20 28
         L32 40
         L32 50
         L20 38
         Z"
      fill="#FFFFFF"
      fill-opacity="0.62"
    />

    <!-- Right depth face -->
    <path
      d="M32 40
         L44 28
         L44 38
         L32 50
         Z"
      fill="#FFFFFF"
      fill-opacity="0.42"
    />

  </g>
</svg>